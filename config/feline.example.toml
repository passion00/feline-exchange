mode = "paper"
database_path = "data/feline.db"
log_directory = "logs"
tick_interval_seconds = 0.25
snapshot_interval_ticks = 20

[providers.oanda]
enabled = false
token_env = "FELINE_OANDA_API_TOKEN"
account_id_env = "FELINE_OANDA_ACCOUNT_ID"
environment = "practice"
historical_price_basis = "mid"
timeout_seconds = 30.0
max_retries = 4
stale_after_seconds = 10.0
feed_timeout_seconds = 15.0
reconnect_delay_seconds = 1.0
maximum_reconnect_delay_seconds = 30.0
instruments = ["EURUSD"]

[providers.alpha_vantage]
enabled = false
credential_env = "FELINE_ALPHA_VANTAGE_API_KEY"
queue_size = 128
max_retries = 3

[providers.ecb_news]
enabled = false
queue_size = 128
max_retries = 3

[paper]
initial_cash = 100000.0
slippage_bps = 1.0
volatility_slippage_multiplier = 5.0
spread_slippage_factor = 0.05
size_slippage_bps_per_unit = 0.0
fixed_latency_ms = 0.0
variable_latency_ms = 0.0
random_seed = 0
liquidity_fraction = 1.0
flat_commission = 0.0
percentage_commission = 0.0
per_unit_commission = 0.0
minimum_commission = 0.0
replay_end_policy = "MARK_TO_MARKET"
synthetic_spread_bps = 2.0

[risk]
max_position_size = 100.0
max_total_exposure = 100000.0
max_loss_per_trade = 1000.0
max_daily_loss = 2500.0
max_drawdown = 0.10
max_allowed_spread = 0.01
emergency_volatility_threshold = 0.10
trading_enabled = true
event_minutes_before = 30.0
event_minutes_after = 30.0
event_position_factor = 0.25
event_exposure_factor = 0.25
event_block_new_positions = true

[ai]
enabled = true
# managed_local owns repository-local llama.cpp/model assets. Use
# openai_compatible to retain an externally managed endpoint.
provider = "managed_local"
base_url = "http://127.0.0.1:8081"
model = "feline/qwen3-4b-q4km"
# model_id = "qwen3-4b-q4km" # default/control; experimental candidate: qwen35-4b-q5km
# Legacy/default deadline for uncategorized AI jobs.
request_timeout_seconds = 30.0
# An already-existing deterministic signal is short-lived.
trading_assessment_timeout_seconds = 30.0
# Thinking news interpretation on local CPU hardware is intentionally allowed
# up to fifteen minutes. Model latency is not news expiry.
news_thesis_timeout_seconds = 900.0
retries = 1
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
inference_seed = 17
max_tokens = 2048
minimum_confidence = 0.65
# These two limits apply only to locked deterministic signal assessment, not
# to MarketThesis creation. Thesis expiry and confirmation entry-staleness are
# configured separately below.
context_max_age_seconds = 20.0
maximum_price_move_fraction = 0.001
# advisory/record/confirm_or_veto remain compatible; news_thesis enables NEWS -> THESIS -> PRICE confirmation.
decision_mode = "advisory"
queue_size = 32
models_directory = "models"
runtime_directory = "runtime/llama.cpp"
preference_path = "data/ai_preferences.json"
# custom_model_path and llama_server_executable are optional overrides.
# custom_model_path = "/path/to/custom-model.gguf"
# llama_server_executable = "/path/to/llama-server"
context_size = 8192
# threads = 8
# gpu_layers = 0
startup_timeout_seconds = 30.0
reasoning_mode = "auto"
news_thesis_reasoning_mode = "thinking"
trading_assessment_reasoning_mode = "disabled"

[news]
enabled = false
provider = "rss"
poll_interval_seconds = 60.0
feed_urls = []
dedup_history = 10000
queue_size = 128
request_timeout_seconds = 10.0

[thesis]
minimum_confidence = 0.65
minimum_relevance = 0.5
maximum_active_theses = 16
maximum_focused_instruments = 8
default_expiry_minutes = 240.0
maximum_reference_move_fraction = 0.01

[confirmation]
strategy = "reference_signal_alignment"
minimum_signal_strength = 0.05
reject_opposite_signal = true

[strategy]
enabled = true
fast_period = 3
slow_period = 5
atr_period = 3
risk_fraction = 0.002
max_signal_quantity = 10.0

# Initial, unoptimized continuous-market research defaults.
[continuous]
minimum_history = 61
maximum_gap_minutes = 2.0
trend_min_slope_per_minute = 0.000025
trend_min_price_vs_ma = 0.0008
ranging_max_slope_per_minute = 0.00002
ranging_max_range = 0.004
expansion_volatility_ratio = 1.8
compression_volatility_ratio = 0.55
minimum_activity_volatility = 0.00005
pullback_min = 0.0001
pullback_max = 0.0015
range_entry_zscore = 0.8
event_minutes_before = 30.0
event_minutes_after = 30.0

[continuous.risk_sizing]
mode = "risk"
starting_equity = 100000.0
risk_fraction = 0.0025

[markets.EURUSD]
profile = "EURUSD"
[markets.XAUUSD]
profile = "XAUUSD"
[markets.BTCUSD]
profile = "BTCUSD"

[execution_profiles.EURUSD.research_default]
spread_bps = 2.0
base_slippage_bps = 1.0
spread_dependent_slippage = 0.05
calibrated = false
[execution_profiles.XAUUSD.research_default]
spread_bps = 3.0
base_slippage_bps = 1.5
spread_dependent_slippage = 0.05
calibrated = false
[execution_profiles.BTCUSD.research_default]
spread_bps = 5.0
base_slippage_bps = 2.0
spread_dependent_slippage = 0.05
calibrated = false
