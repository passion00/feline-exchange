mode = "paper"
database_path = "data/feline.db"
log_directory = "logs"
tick_interval_seconds = 0.25
snapshot_interval_ticks = 20

[providers.alpha_vantage]
enabled = false
credential_env = "FELINE_ALPHA_VANTAGE_API_KEY"
queue_size = 128
max_retries = 3

[providers.ecb_news]
enabled = false
queue_size = 128
max_retries = 3

[paper]
initial_cash = 100000.0
slippage_bps = 1.0
volatility_slippage_multiplier = 5.0
spread_slippage_factor = 0.05
size_slippage_bps_per_unit = 0.0
fixed_latency_ms = 0.0
variable_latency_ms = 0.0
random_seed = 0
liquidity_fraction = 1.0
flat_commission = 0.0
percentage_commission = 0.0
per_unit_commission = 0.0
minimum_commission = 0.0
replay_end_policy = "MARK_TO_MARKET"
synthetic_spread_bps = 2.0

[risk]
max_position_size = 100.0
max_total_exposure = 100000.0
max_loss_per_trade = 1000.0
max_daily_loss = 2500.0
max_drawdown = 0.10
max_allowed_spread = 0.01
emergency_volatility_threshold = 0.10
trading_enabled = true
event_minutes_before = 30.0
event_minutes_after = 30.0
event_position_factor = 0.25
event_exposure_factor = 0.25
event_block_new_positions = true

[ai]
enabled = true
base_url = "http://127.0.0.1:8081"
model = "llmware/qwen3-4b-instruct-gguf:Q4_K_M"
request_timeout_seconds = 30.0
queue_size = 32

[strategy]
enabled = true
fast_period = 3
slow_period = 5
atr_period = 3
risk_fraction = 0.002
max_signal_quantity = 10.0
